id = "gpt-image-1-mini"
label = "GPT Image 1 Mini"
category = "IMG"
platform = "openai"
endpoint = "gpt-image-1-mini"
api_path = "images/generations"
mode = "sync"
description = "GPT Image 1 Mini: OpenAI image generation, one call in and one answer back."

[pricing]
note = "unset — take the price from OpenAI own pricing page before shipping"

[general]
kind = "image"
prompt = "required"
image_url_param = "images"
edit_api_path = "images/edits"

[params.size]
label = "Size"
type = "select"
default = "auto"
options = [{ value = "auto", label = "auto" }, { value = "1024x1024", label = "1024x1024" }, { value = "1536x1024", label = "1536x1024" }, { value = "1024x1536", label = "1024x1536" }]

[params.quality]
label = "Quality"
type = "select"
default = "auto"
options = [{ value = "auto", label = "auto" }, { value = "low", label = "low" }, { value = "medium", label = "medium" }, { value = "high", label = "high" }]

[params.background]
label = "Background"
type = "select"
default = "auto"
options = [{ value = "auto", label = "auto" }, { value = "opaque", label = "opaque" }, { value = "transparent", label = "transparent" }]

[params.output_format]
label = "Output Format"
type = "select"
default = "png"
options = [{ value = "png", label = "png" }, { value = "webp", label = "webp" }, { value = "jpeg", label = "jpeg" }, { value = "gif", label = "gif" }, { value = "svg", label = "svg" }]

[params.n]
label = "Number of Images"
type = "integer"
default = 1
min = 1
max = 4
