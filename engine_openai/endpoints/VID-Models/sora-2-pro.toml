endpoint = "sora-2-pro"
api_path = "videos"
mode = "async"
content_path = "videos/{id}/content"
description = "Sora 2 Pro: OpenAI video model. A job is created and polled, then the file is fetched from the content path."

[pricing]
note = "unset — take the price from OpenAI own pricing page before shipping"

