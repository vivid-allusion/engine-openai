platform: openai
media_type: image
endpoint: gpt-image-2-2026-04-21
description: GPT Image 2 (pinned)
parameters:
  # size — "auto" lets the model choose. Or pick one:
  #   1024x1024 (square) | 1536x1024 (landscape) | 1024x1536 (portrait)
  #   2048x2048 (2K square) | 2048x1152 (2K landscape)
  #   3840x2160 (4K landscape) | 2160x3840 (4K portrait)
  #   custom <width>x<height> must also be:
  #     both sides multiples of 16
  #     long:short ratio between 1:3 and 3:1
  #     no edge over 3840 px
  #     total pixels 655,360 to 8,294,400
  #   sizes above 2560x1440 are experimental
  size: "auto"
  # quality — auto | low | medium | high
  quality: "auto"
  # background — auto | opaque | transparent
  #   transparent requires output_format png or webp
  background: "auto"
  # output_format — png | webp | jpeg | gif | svg
  output_format: "png"
  # n — 1 to 10 images per call
  n: 1
prompt_prefix: ""
prompt_suffix: ""
