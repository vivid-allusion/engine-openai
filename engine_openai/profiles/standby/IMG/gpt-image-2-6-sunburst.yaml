platform: openai
media_type: image
endpoint: gpt-image-2.6-sunburst
description: GPT Image 2.6 Sunburst
parameters:
  # size — "auto" lets the model choose. Or pick one:
  #   1024x1024 (square) | 1536x1024 (landscape) | 1024x1536 (portrait)
  # Custom WIDTHxHEIGHT is documented for GPT Image 2 and 2.5, not yet for 2.6.
  size: "auto"
  # quality — auto | low | medium | high | xhigh | max
  quality: "auto"
  # complexity — low | medium | high (default high)
  complexity: "high"
  # background — auto | opaque | transparent
  #   transparent requires output_format png or webp
  background: "auto"
  # output_format — png | webp | jpeg | gif | svg
  output_format: "png"
  # n — 1 to 10 images per call
  n: 1
prompt_prefix: ""
prompt_suffix: ""
